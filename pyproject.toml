[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "search-engine-from-scratch"
description = "An inverted-index search engine built from scratch on the Python standard library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dibya2521" }]
keywords = ["information-retrieval", "inverted-index", "search-engine", "tf-idf"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dynamic = ["version"]

# Standard library only by design. See docs/adr/0001-toolchain.md.
dependencies = []

[project.scripts]
search-engine = "search_engine.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.120",
  "nltk>=3.9",
  "pre-commit>=4.0",
  "pylint>=3.3",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.version]
path = "src/search_engine/__init__.py"

[tool.hatch.build.targets.sdist]
# Allowlist: git-excluded folders are invisible to git, not to the build backend.
only-include = ["src", "tests", "docs", "benchmarks", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_engine"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing comma, owned by the formatter
  "CPY001", # per-file copyright header, LICENSE already covers this
  "D107",   # the class docstring documents construction, per the google convention
  "ISC001", # implicit string concat, owned by the formatter
]

[tool.ruff.lint.per-file-ignores]
# A bare assert and a bare number read better in a test.
"tests/**/*.py" = ["D103", "PLR2004", "S101"]
# Not importable, may print, and seed a plain RNG for reproducible data.
"benchmarks/**/*.py" = ["INP001", "S311", "T201"]
"scripts/**/*.py" = ["INP001", "S311", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 25

[tool.ruff.format]
docstring-code-format = true

# Only the four checks ruff cannot run. See docs/adr/0001-toolchain.md.
[tool.pylint.main]
py-version = "3.12"
jobs = 0

[tool.pylint.design]
max-locals = 12
max-nested-blocks = 3

[tool.pylint.messages_control]
disable = ["all"]
enable = [
  "duplicate-code",
  "redefined-outer-name",
  "too-many-locals",
  "too-many-nested-blocks",
]

[tool.pyright]
include = ["src", "tests", "scripts", "benchmarks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# A warning is a defect that has not been diagnosed yet.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["search_engine"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']
