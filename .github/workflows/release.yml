name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project and dev group
        run: uv sync --locked --all-groups

      # A tag is not a reason to skip the gates. A release that does not pass
      # them is worse than no release, because it is the version people keep.
      - name: Gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pylint src tests
          uv run pyright
          uv run pytest --cov --cov-report=term-missing

      - name: Build sdist and wheel
        run: uv build

      # The tag must match the version the package reports, or the artifacts
      # attached to the release are not the ones the tag names.
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(uv run python -c 'import search_engine; print(search_engine.__version__)')"
          test "$tagged" = "$declared" || {
            echo "tag $tagged does not match version $declared" >&2
            exit 1
          }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes "See CHANGELOG.md for what changed and why."
          dist/*
